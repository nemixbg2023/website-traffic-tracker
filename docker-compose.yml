services:
  app:
    build: .
    container_name: traffic-tracker-app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/app
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: traffic-tracker-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: traffic_tracker
      MYSQL_USER: tracker_user
      MYSQL_PASSWORD: trackerpass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: traffic-tracker-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootpass
    depends_on:
      - db

volumes:
  db_data: