services:
  app:
    build: .
    container_name: traffic-tracker-app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/app
    depends_on:
      - db
    tty: true
    stdin_open: true

  db:
    image: mysql:8.0
    container_name: traffic-tracker-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: traffic_tracker
      MYSQL_USER: tracker_user
      MYSQL_PASSWORD: trackerpass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/init-test-db.sql:/docker-entrypoint-initdb.d/02-init-test-db.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: traffic-tracker-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootpass
    depends_on:
      - db

volumes:
  db_data: